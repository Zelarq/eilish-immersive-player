<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="grad-everything-i-wanted" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a0b2e" />
            <stop offset="100%" stop-color="#0b0416" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="500" height="500" fill="url(#grad-everything-i-wanted)" />
    
    
            <!-- Stars / nebulae pattern -->
            <circle cx="70" cy="80" r="2" fill="#ffffff" opacity="0.8" />
            <circle cx="380" cy="120" r="3" fill="#ffffff" opacity="0.5" />
            <circle cx="150" cy="380" r="1.5" fill="#ffffff" opacity="0.9" />
            <circle cx="420" cy="350" r="2" fill="#ffffff" opacity="0.7" />
            <circle cx="250" cy="250" r="130" fill="none" stroke="#9c27b0" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
            <path d="M 100 200 Q 250 150 400 200 T 250 400" fill="none" stroke="#9c27b0" stroke-width="1.5" opacity="0.2" />
        
    
    <!-- Title Text and Labels -->
    <g text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif">
        <text x="250" y="220" font-size="28" font-weight="800" fill="#9c27b0" letter-spacing="4" text-transform="uppercase">everything i wanted</text>
        <text x="250" y="270" font-size="12" font-weight="500" fill="#9c27b0" letter-spacing="8" opacity="0.7" text-transform="uppercase">BILLIE EILISH</text>
    </g>
</svg>