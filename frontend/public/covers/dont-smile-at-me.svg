<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="grad-dont-smile-at-me" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b71c1c" />
            <stop offset="100%" stop-color="#d32f2f" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="500" height="500" fill="url(#grad-dont-smile-at-me)" />
    
    
            <!-- Pop art minimalism / bold frame -->
            <rect x="30" y="30" width="440" height="440" fill="none" stroke="#ffeb3b" stroke-width="8" opacity="0.8" />
            <circle cx="250" cy="250" r="80" fill="none" stroke="#ffeb3b" stroke-width="2" opacity="0.3" />
            <line x1="30" y1="30" x2="470" y2="470" stroke="#ffeb3b" stroke-width="1" opacity="0.15" />
        
    
    <!-- Title Text and Labels -->
    <g text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif">
        <text x="250" y="220" font-size="28" font-weight="800" fill="#ffeb3b" letter-spacing="4" text-transform="uppercase">dont smile at me</text>
        <text x="250" y="270" font-size="12" font-weight="500" fill="#ffeb3b" letter-spacing="8" opacity="0.7" text-transform="uppercase">BILLIE EILISH</text>
    </g>
</svg>