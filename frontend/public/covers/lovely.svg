<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="grad-lovely" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1c2833" />
            <stop offset="100%" stop-color="#34495e" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="500" height="500" fill="url(#grad-lovely)" />
    
    
            <!-- Intersecting glass rings -->
            <circle cx="220" cy="250" r="100" fill="none" stroke="#d5dbdb" stroke-width="3" opacity="0.25" />
            <circle cx="280" cy="250" r="100" fill="none" stroke="#d5dbdb" stroke-width="3" opacity="0.25" />
            <line x1="250" y1="50" x2="250" y2="450" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="10,10" opacity="0.15" />
        
    
    <!-- Title Text and Labels -->
    <g text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif">
        <text x="250" y="220" font-size="28" font-weight="800" fill="#d5dbdb" letter-spacing="4" text-transform="uppercase">lovely</text>
        <text x="250" y="270" font-size="12" font-weight="500" fill="#d5dbdb" letter-spacing="8" opacity="0.7" text-transform="uppercase">WITH KHALID</text>
    </g>
</svg>